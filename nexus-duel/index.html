<!doctype html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#09101f" /><meta name="description" content="星核战线：一款双人同屏回合制策略对战小游戏。占领能量井、招募三类单位并摧毁对手星核。" /><title>星核战线 · 双人策略对战</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2309101f'/%3E%3Cpath d='M50 12 72 28 64 54 50 88 36 54 28 28Z' fill='%234fc3ff'/%3E%3Ccircle cx='50' cy='42' r='13' fill='%23fff'/%3E%3C/svg%3E" /><link rel="stylesheet" href="style.css" /></head><body><div class="app" id="app"><header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true"><span>✦</span></div><div class="brand-copy"><h1>星核战线</h1><p>Nexus Duel · Local Strategy Game</p></div></div><div class="top-actions"><button class="icon-btn" id="rulesBtn" type="button" title="查看规则">？<span class="label"> 规则</span></button><button class="icon-btn" id="soundBtn" type="button" title="开关声音">♪<span class="label" id="soundLabel"> 开</span></button><button class="icon-btn" id="shareBtn" type="button" title="复制游戏链接">↗<span class="label"> 分享</span></button><button class="icon-btn" id="newBtn" type="button" title="新建对局">＋<span class="label"> 新局</span></button></div></header><main class="game-shell"><aside class="panel player-panel red" id="playerPanel0" aria-label="红方状态"></aside><section class="center-stage" aria-label="游戏棋盘与操作区"><div class="status-strip"><div class="round-chip" id="roundLabel">第 1 / 20 回合</div><div class="instruction" id="instruction">选择己方单位开始行动</div><div class="ap-group" aria-label="剩余指令点"><span class="ap-label">指令</span><span class="ap-dot" id="ap0"></span><span class="ap-dot" id="ap1"></span><span class="ap-dot" id="ap2"></span></div></div><div class="board-frame"><div class="board" id="board" role="grid" aria-label="7乘7战术棋盘"></div></div><section class="control-panel" aria-label="行动控制"><div class="selection-row"><div id="selectionInfo"><div class="selection-title">等待指令</div><div class="selection-meta">点击己方单位，绿色格可移动，红色格可攻击。</div></div><div class="selection-actions"><button class="soft-btn" id="cancelBtn" type="button">取消选择</button></div></div><div class="recruit-title"><span><strong id="recruitOwner">当前玩家</strong> · 招募消耗 1 指令</span><span>新单位下回合行动</span></div><div class="recruit-grid" id="recruitGrid"></div><div class="turn-buttons"><button class="soft-btn" id="undoBtn" type="button">↶ 撤销本回合</button><button class="soft-btn" id="repairBtn" type="button">✚ 修复星核</button><button class="primary-btn end-turn" id="endTurnBtn" type="button">结束回合 →</button></div></section><details class="battle-log" id="battleLog"><summary>战报记录</summary><ol id="logList"></ol></details><div class="legend" aria-label="棋盘图例"><span><i style="background:var(--green)"></i>可移动</span><span><i style="background:var(--red)"></i>可攻击</span><span><i style="background:var(--gold)"></i>能量井</span><span>据点上的单位获得 1 点防御</span></div></section><aside class="panel player-panel blue" id="playerPanel1" aria-label="蓝方状态"></aside></main><p class="footer-note">同屏双人 · 自动保存 · 无需注册 · 第 20 回合结束后按战力结算</p></div><div class="toast-stack" id="toastStack" aria-live="polite"></div><div class="overlay" id="modalOverlay" hidden><div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div><div class="overlay" id="passOverlay" hidden><div class="modal-card pass-card" id="passCard" role="dialog" aria-modal="true" aria-label="交换玩家"></div></div><script src="game.js"></script></body></html>
