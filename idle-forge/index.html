<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <meta name="description" content="熔星纪元是一款原创中文放置 RPG 小游戏：采集、锻造、战斗与离线成长。">
  <meta name="color-scheme" content="dark">
  <title>熔星纪元 · 放置冒险</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%236fe3c1'/%3E%3Cstop offset='1' stop-color='%23ffb35c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23101722'/%3E%3Cpath d='M32 8 49 18v20L32 56 15 38V18z' fill='none' stroke='url(%23g)' stroke-width='5'/%3E%3Cpath d='m32 17 6 12-6 18-6-18z' fill='%23ffcf74'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <div class="app-shell" id="app">
    <header class="topbar">
      <a class="brand" href="#" data-tab="woodcutting" aria-label="回到伐木页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <path class="brand-hex" d="M32 6 51 17v22L32 58 13 39V17z"></path>
            <path class="brand-flame" d="M32 15c1 8 9 10 7 20-1 7-5 12-7 14-2-2-8-7-7-15 0-5 3-8 4-13 2 3 3 6 3 9 3-4 2-9 0-15z"></path>
          </svg>
        </span>
        <span>
          <strong>熔星纪元</strong>
          <small>EMBER AGE · IDLE RPG</small>
        </span>
      </a>

      <div class="top-stats" aria-label="玩家总览">
        <div class="top-stat">
          <span class="stat-icon coin-icon" aria-hidden="true">◈</span>
          <span><small>星币</small><strong id="topCoins">0</strong></span>
        </div>
        <div class="top-stat">
          <span class="stat-icon" aria-hidden="true">✦</span>
          <span><small>总等级</small><strong id="topLevel">4</strong></span>
        </div>
        <div class="top-stat desktop-only">
          <span class="stat-icon" aria-hidden="true">⚔</span>
          <span><small>战力</small><strong id="topPower">0</strong></span>
        </div>
      </div>

      <div class="header-actions">
        <button class="icon-button" id="saveNowButton" type="button" title="立即保存" aria-label="立即保存">
          <span aria-hidden="true">⌁</span>
        </button>
        <button class="icon-button" id="settingsButton" type="button" title="存档与设置" aria-label="存档与设置">
          <span aria-hidden="true">⚙</span>
        </button>
      </div>
    </header>

    <div class="game-layout">
      <aside class="left-rail" aria-label="游戏功能导航">
        <nav class="game-nav" id="gameNav"></nav>
        <div class="rail-card desktop-only">
          <span class="rail-kicker">旅者提示</span>
          <p id="rotatingTip">同一时间只能进行一种行动，但离线时行动仍会继续。</p>
          <div class="mini-orbit" aria-hidden="true"><span></span><i></i></div>
        </div>
      </aside>

      <main class="main-stage" id="mainStage" tabindex="-1">
        <noscript>
          <section class="panel empty-state">
            <h1>需要启用 JavaScript</h1>
            <p>这款小游戏完全在浏览器本地运行，需要 JavaScript 保存进度并推进游戏。</p>
          </section>
        </noscript>
      </main>

      <aside class="right-rail">
        <section class="panel activity-panel" id="activityPanel" aria-live="polite"></section>

        <section class="panel inventory-panel">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">背包</span>
              <h2>资源库存</h2>
            </div>
            <span class="count-chip" id="inventoryKinds">0 种</span>
          </div>
          <div class="inventory-grid" id="inventoryGrid"></div>
        </section>

        <section class="panel contracts-panel">
          <div class="panel-heading">
            <div>
              <span class="eyebrow">委托</span>
              <h2>当前目标</h2>
            </div>
            <button class="text-button" type="button" data-tab="journal">全部</button>
          </div>
          <div id="contractList" class="contract-list"></div>
        </section>
      </aside>
    </div>

    <footer class="site-footer">
      <span>自动存档 · 进度保存在当前浏览器</span>
      <span>原创放置 RPG 原型，与任何商业游戏无关联</span>
    </footer>
  </div>

  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="false"></div>

  <dialog class="game-dialog" id="gameDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-header">
        <div>
          <span class="eyebrow" id="dialogEyebrow">系统</span>
          <h2 id="dialogTitle">提示</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="关闭弹窗" type="submit">×</button>
      </div>
      <div class="dialog-body" id="dialogBody"></div>
      <div class="dialog-actions" id="dialogActions"></div>
    </form>
  </dialog>

  <template id="sparkTemplate">
    <span class="spark" aria-hidden="true"></span>
  </template>

  <script src="./game.js" defer></script>
</body>
</html>
