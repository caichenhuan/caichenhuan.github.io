<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="原创浏览器小游戏《金铲铲·装备雨》：接住装备、冲击高分。">
  <title>金铲铲·装备雨</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b16;color:#f6f3e8;font-family:system-ui,-apple-system,"Segoe UI","PingFang SC",sans-serif}body{display:grid;place-items:center;min-height:100dvh;background:radial-gradient(circle at 50% 20%,#201d48,#080b16 58%)}main{text-align:center;padding:24px}.mark{width:72px;height:72px;margin:auto;border-radius:22px;display:grid;place-items:center;font-size:38px;background:#2b2419;border:1px solid #6a5728;box-shadow:0 20px 60px #0008}h1{font-size:24px;margin:18px 0 8px}p{color:#aeb7d0;font-size:13px;line-height:1.6}.bar{width:220px;height:6px;background:#ffffff16;border-radius:9px;overflow:hidden;margin:18px auto}.bar:after{content:"";display:block;width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ffe58f,#e58a16);animation:a 1s ease-in-out infinite alternate}@keyframes a{to{transform:translateX(120%)}}
  </style>
</head>
<body>
  <main>
    <div class="mark">🏆</div>
    <h1>金铲铲·装备雨</h1>
    <p id="status">正在加载游戏…</p>
    <div class="bar"></div>
  </main>
  <script>
    (async()=>{
      try{
        const names=['part1.txt','part2.txt','part3.txt','part4.txt','part5.txt'];
        const pieces=await Promise.all(names.map(async name=>{
          const response=await fetch(`${name}?v=20260715`,{cache:'no-store'});
          if(!response.ok) throw new Error('游戏资源加载失败，请刷新重试');
          return (await response.text()).trim();
        }));
        if(!('DecompressionStream' in self)) throw new Error('当前浏览器版本过旧，请升级 Chrome、Safari 或微信后再试');
        const bytes=Uint8Array.from(atob(pieces.join('')),c=>c.charCodeAt(0));
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.querySelector('.bar')?.remove();
        document.getElementById('status').textContent=error?.message||'加载失败，请刷新重试';
      }
    })();
  </script>
</body>
</html>
