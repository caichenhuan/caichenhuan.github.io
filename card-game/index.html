<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d22">
  <title>星渊牌局 · 三线对决</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;color:#eaf7ff;background:radial-gradient(circle at 50% 30%,#1b2450,#070a18 60%);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.load{text-align:center}.sigil{display:grid;width:72px;height:72px;margin:0 auto 18px;place-items:center;border:1px solid #72e9ff66;border-radius:24px;color:#72e9ff;font-size:32px;transform:rotate(45deg);animation:p 1.2s ease-in-out infinite alternate}.sigil span{transform:rotate(-45deg)}p{color:#9fa9ca;font-size:13px;letter-spacing:.08em}@keyframes p{to{box-shadow:0 0 35px #72e9ff44;filter:brightness(1.35)}}
  </style>
</head>
<body>
  <div class="load"><div class="sigil"><span>✦</span></div><strong>星渊牌局</strong><p>正在开启星门…</p></div>
  <script src="./payload-0.js"></script>
  <script src="./payload-1.js"></script>
  <script>
    (async()=>{
      try{
        const text=(window.__ASTRAL_PAYLOAD||[]).join('');
        const raw=atob(text); const bytes=new Uint8Array(raw.length);
        for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
        if(!('DecompressionStream' in window)) throw new Error('当前浏览器版本过旧，请升级后重试。');
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        document.open(); document.write(html); document.close();
      }catch(error){document.body.innerHTML='<div class="load"><strong>游戏加载失败</strong><p>'+String(error.message||error)+'</p></div>';}
    })();
  </script>
  <noscript>此游戏需要启用 JavaScript。</noscript>
</body>
</html>
